function ellipse(x,y,z,r,fill,stroke='black-side'){
 const a=Array.from({length:33},(_,i)=>xy(x+Math.cos(i*Math.PI/16)*r,y+Math.sin(i*Math.PI/16)*r,z));return polygon(a,fill,stroke);
}
function cylinder(x,y,z,r,h,top='metal-light',side='metal-side'){

  const path='M '+a.join(' ')+' C '+[a[0]+(left?-65:65),a[1]-55].join(' ')+' '+[b[0]+(left?40:-40),b[1]].join(' ')+' '+b.join(' ');
  const selected=net&&state.wire===net.id,visible=state.family==='all'||state.family===color||color==='ground';
  routes+='<g data-wire="'+(net?net.id:'')+'" class="cursor-interaction"><path class="ra-wire" d="'+path+'" stroke="'+C(color)+'" stroke-width="'+(selected?4:1.8)+'" opacity="'+(visible?.7:.12)+'"/><path class="ra-wire-hit" d="'+path+'"/></g>';
  routes+='<g data-wire="'+(net?net.id:'')+'" class="cursor-interaction"><circle cx="'+b[0]+'" cy="'+b[1]+'" r="4" fill="'+C(color)+'"/>'+label(x,y,pin,false,left?'start':'start')+label(x,y+23,dest,true,'start')+'</g>';
 });
 art+=label(536,249,'ARDUINO UNO / R3')+label(570,670,'D10–D12 为霍尔输入，D9 为油门输出',true)+label(565,703,'A0 转向反馈 · A1–A3 左轮霍尔',true);
 return art+routes;
}
function selectedWires(){
 const list=ownWires(state.component).filter(w=>state.family==='all'||w.f===state.family||w.f==='ground'||w.f==='usb');
 return list.length?list:ownWires(state.component);
}
function renderInspector(){
 const info=records[state.component];root.querySelector('[data-inspect="title"]').textContent=info.name;root.querySelector('[data-inspect="role"]').textContent=info.role;
 root.querySelector('#ra-component-choice').value=state.component;
 const items=selectedWires();
 root.querySelector('[data-inspect="wires"]').innerHTML=items.length?items.map(w=>'<button type="button" class="ra-netrow cursor-interaction" data-net="'+w.id+'" aria-pressed="'+(w.id===state.wire)+'"><span class="ra-dot" style="--dot:'+C(w.color)+'"></span><span><b>'+E(w.label)+'</b><small>'+E(w.f==='ground'?'信号参考地':({steer:'转向控制 / 位置反馈',throttle:'模拟油门支路',reverse:'前后方向支路',hall:'车轮霍尔反馈',power:'电源 / 动力线路',usb:'USB 通信与供电'}[w.f]||''))+'</small></span></button>').join(''):'<p class="ra-detail-copy">'+E(info.note)+'</p>';
 root.querySelector('[data-inspect="about"]').innerHTML='<p><strong>'+E(info.model)+'</strong></p><p>'+E(info.note)+'</p><p>'+E(info.spec)+'</p>'+(info.link?'<p><a href="'+E(info.link[1])+'" target="_blank" rel="noopener noreferrer">'+E(info.link[0])+' ↗</a></p>':'');
 root.querySelector('[data-inspect="wires"]').hidden=state.detail!=='wires';root.querySelector('[data-inspect="about"]').hidden=state.detail!=='about';
 const w=wires.find(w=>w.id===state.wire);
 root.querySelector('[data-focus="eyebrow"]').textContent=w?'端子 → 线路 → 作用':'模块原理';root.querySelector('[data-focus="title"]').textContent=w?w.label:info.name;root.querySelector('[data-focus="copy"]').textContent=w?w.copy:info.note;
}
function save(){try{localStorage.setItem('rover-atlas-state',JSON.stringify({view:state.view,component:state.component,wire:state.wire,family:state.family}));}catch{}}
function render(){
 root.dataset.view=state.view;
 root.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
 root.querySelectorAll('[data-family]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.family===state.family)));
 root.querySelectorAll('[data-detail]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.detail===state.detail)));
 root.querySelectorAll('[data-turn]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.turn===state.turn)));
 const width=stage.clientWidth||740,height=stage.clientHeight||610,baseHeight=state.view==='car'?800:state.view==='pins'?760:960;
 const k=Math.min(width/1125,height/baseHeight)*.96*state.zoom;scaleForText=k;portMap={};centres={};annotations=[];bp=state.view==='car'?[.91,.24,-.48,.52]:[1,.18,-.28,.78];
 let art='';
 if(state.view==='car')art=carGeometry();
 else if(state.view==='pins')art=pinsGeometry();
 else{for(const [id,kind,x,y,s,name,lx,ly]of bench){art+=model(id,kind,x,y,s);if(name)art+=label(lx,ly,name,id==='source'||id==='ground'||id==='junction');}art+=label(552,930,'动力电源与控制供电分开；功率负极不经过 Uno',true);}
 let tx=(width-1125*k)/2,ty=(height-baseHeight*k)/2;
 if(state.zoom>1&&centres[state.component]){tx=width/2-centres[state.component][0]*k;ty=height/2-centres[state.component][1]*k;}
 svg.setAttribute('viewBox','0 0 '+width+' '+height);
 svg.innerHTML='<title>初代小车的实体结构、板卡端子与电气连接</title><desc>通过上方视图、线路分类和右侧逐根接线列表选择模块或线路。整车透视包含前轮后方的中央转向电机与双连杆。</desc><g transform="translate('+fmt(tx)+' '+fmt(ty)+') scale('+fmt(k)+')">'+art+(state.view==='pins'?'':renderWires())+annotations.join('')+'</g>';
 root.querySelector('[data-scene-note]').textContent=state.view==='car'?'车头朝右上 · 点部件看接线 · 动作仅作机构示意':state.view==='pins'?'点引脚引线，看每个接口的去向':'点端子或线缆，沿线路看清每一处分支';
 renderInspector();
}
const select=root.querySelector('#ra-component-choice');
const selectable=['uno','pi','l298','sensor','motor','relay','left','right','dc','battery','bank','hall','lwheel','rwheel','r1','r2','cap','ren','ground','junction','switch','source'];
select.innerHTML=selectable.map(id=>'<option value="'+id+'">'+E(records[id].name)+'</option>').join('');
function pickComponent(id){if(!records[id])return;state.component=id;const a=selectedWires();state.wire=a[0]?.id||'';state.zoom=1;state.detail='wires';render();save();}
function pickWire(id){const w=wires.find(w=>w.id===id);if(!w)return;state.wire=id;if(![w.a[0],w.b[0]].includes(state.component))state.component=w.a[0];render();save();}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');
 if(b&&root.contains(b)){
  if(b.dataset.view){state.view=b.dataset.view;state.zoom=1;if(state.view==='pins')state.component='uno';render();save();return;}
  if(b.dataset.family){state.family=b.dataset.family;state.component={all:'uno',steer:'l298',throttle:'junction',reverse:'relay',hall:'hall',power:'battery'}[state.family];state.wire=selectedWires()[0]?.id||'';state.zoom=1;render();save();return;}
  if(b.dataset.detail){state.detail=b.dataset.detail;render();return;}
  if(b.dataset.net){pickWire(b.dataset.net);return;}
  if(b.dataset.extra){state.component=b.dataset.extra;state.wire='';state.detail='about';state.zoom=1;render();save();return;}
  if(b.dataset.turn!==undefined){state.turn=+b.dataset.turn;state.family='steer';state.component='motor';state.wire='motor-a';render();return;}
  if(b.dataset.zoom){state.zoom=b.dataset.zoom==='reset'?1:Math.max(.75,Math.min(2.75,state.zoom+(b.dataset.zoom==='in'?.45:-.45)));render();return;}
 }
 const w=event.target.closest('[data-wire]');if(w){pickWire(w.dataset.wire);return;}
 const c=event.target.closest('[data-component]');if(c)pickComponent(c.dataset.component);
});
select.addEventListener('change',()=>pickComponent(select.value));
new ResizeObserver(()=>render()).observe(stage);render();
})();
</script>
</div>
